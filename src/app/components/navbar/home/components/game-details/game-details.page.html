<ion-content [fullscreen]="true" class="ion-padding bg-primary">
  <div *ngIf="showError" class="error-banner">
    <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
    <span>{{ errorMessage }}</span>
    <ion-button size="small" fill="clear" color="danger" (click)="dismissError()">Dismiss</ion-button>
  </div>

  <ion-row>
    <ion-col size="2">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/tabs/home/games" (click)="confirmExit($event)"></ion-back-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-col>
    <ion-col size="6">
      <h2 class="section-header">
        {{ 'COMPONENTS.NAVBAR.SETTINGS.QUIZ' | transloco }}
      </h2>
    </ion-col>
    <ion-col size="4" class="ion-text-right ion-padding-top">
      <span class="progress-label">{{ answeredCount }}/{{ questions.length }}</span>
    </ion-col>
  </ion-row>

  <ion-list>
    <ion-item *ngFor="let question of questions; let i = index">
      <ion-label>
        <h2 [innerHTML]="question.question"></h2>
        <ion-radio-group (ionChange)="selectAnswer(i, $event.detail.value)">
          <ion-item *ngFor="let answer of shuffledAnswers[i]">
            <ion-radio
              slot="start"
              [value]="answer"
              [disabled]="answeredQuestions[i]"
            ></ion-radio>
            <ion-label [innerHTML]="answer"></ion-label>
          </ion-item>
        </ion-radio-group>
        <div *ngIf="feedbacks[i]" class="feedback" [class.correct]="feedbacks[i] === 'Correct!'">
          {{ feedbacks[i] }}
        </div>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-fab *ngIf="allAnswered && !submitted" vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button color="success" (click)="showResults()">
    <ion-icon name="trophy-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
