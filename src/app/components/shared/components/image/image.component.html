<ion-item [detail]="false" class="post-item" >
  <ion-card>
    <app-error-banner
      [errorMessage]="errorMessage"
      [showError]="showError"
      (dismissError)="dismissError()"
    ></app-error-banner>

    <!-- Header -->
    <div class="post-header">
      <ion-avatar (click)="openProfile(image.postedBy)">
        <img
          [attr.alt]="'COMPONENTS.SHARED.IMAGE.PROFILE_PICTURE' | transloco"
          [src]="generateAvatarUrl(image.displayName || 'devvscape_user')"
        />
      </ion-avatar>
      <div class="post-meta">
        <span class="display-name">{{ image.displayName || 'devvscape_user' }}</span>
        <span class="post-time">{{ image.createdAt | dateAgo }}</span>
      </div>
      <ion-icon
        name="ellipsis-horizontal"
        class="more-icon"
        (click)="imageDropdown(image)"
      ></ion-icon>
    </div>

    <!-- Caption -->
    <div class="post-caption" *ngIf="image.postText">
      <span [innerHTML]="formatCardSubtitle(image)"></span>
      <a *ngIf="image.postText.length > 200" class="read-more" (click)="toggleText()">
        {{ isTextTruncated ? ('COMPONENTS.SHARED.IMAGE.READ_MORE' | transloco) : ('COMPONENTS.SHARED.IMAGE.SHOW_LESS' | transloco) }}
      </a>
    </div>

    <!-- Image -->
    <div class="shimmer-container" *ngIf="!imageLoaded">
      <div class="shimmer"></div>
    </div>
    <img
      (click)="openImage(image.id)"
      [src]="image.imageUrl"
      [alt]="image.postText"
      (load)="imageLoaded = true"
      [class.hidden]="!imageLoaded"
      class="post-img"
    />

    <!-- Action bar -->
    <div class="action-bar" *ngIf="imageLoaded">
      <button class="action-btn" [class.liked]="isLiked" (click)="likeImage(image)">
        <ion-icon [name]="isLiked ? 'star' : 'star-outline'" class="star-icon"></ion-icon>
        <span>{{ image.stars || 0 }}</span>
      </button>
      <button class="action-btn" (click)="toggleReply()">
        <ion-icon name="chatbubble-outline"></ion-icon>
        <span>{{ image.comments.length || 0 }}</span>
      </button>
      <button class="action-btn share-btn" (click)="sharePost(image)">
        <ion-icon name="share-outline"></ion-icon>
      </button>
    </div>
  </ion-card>
</ion-item>
